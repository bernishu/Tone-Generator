<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1113">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tone Bench">
<title>Dual Tone Bench</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F1F3F1;
    --surface:#FBFCFB;
    --sunken:#E7EAE8;
    --ink:#15191B;
    --muted:#5F686C;
    --faint:#8E9799;
    --rule:#D8DDDA;
    --left:#1F6F93;
    --left-soft:#1F6F9322;
    --right:#B8412F;
    --right-soft:#B8412F22;
    --shadow:0 1px 2px rgba(20,28,30,.06), 0 8px 24px -16px rgba(20,28,30,.35);
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1113;
      --surface:#171B1D;
      --sunken:#0A0C0E;
      --ink:#E7ECEA;
      --muted:#98A2A5;
      --faint:#6C7679;
      --rule:#252B2E;
      --left:#5FB3D6;
      --left-soft:#5FB3D622;
      --right:#E87361;
      --right-soft:#E8736122;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1113;
    --surface:#171B1D;
    --sunken:#0A0C0E;
    --ink:#E7ECEA;
    --muted:#98A2A5;
    --faint:#6C7679;
    --rule:#252B2E;
    --left:#5FB3D6;
    --left-soft:#5FB3D622;
    --right:#E87361;
    --right-soft:#E8736122;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 200px; display:flex; flex-direction:column; gap:16px}

  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{
    font-size:19px; font-weight:600; margin:0; letter-spacing:-.01em;
  }
  .sub{font-size:12px; color:var(--faint); font-family:'IBM Plex Mono',ui-monospace,monospace}

  /* ---- scope ---- */
  .scope{
    background:var(--sunken); border:1px solid var(--rule); border-radius:var(--r);
    padding:10px 12px 8px; display:flex; flex-direction:column; gap:8px;
  }
  canvas{width:100%; height:132px; display:block}
  .scope-foot{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .live{display:flex; align-items:center; gap:6px; letter-spacing:.08em; text-transform:uppercase}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--faint)}
  body.playing .dot{background:var(--left); animation:pulse 1.6s ease-in-out infinite}
  body.playing .live{color:var(--ink)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none !important} }

  /* ---- channel ---- */
  .ch{
    background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
    padding:14px 14px 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:12px;
    border-left:3px solid var(--c);
  }
  .ch.L{--c:var(--left)}
  .ch.R{--c:var(--right)}
  .ch.off{opacity:.45}
  .ch-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .ch-name{
    font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--c);
  }
  .mute{
    font:500 11px/1 'Archivo',sans-serif; letter-spacing:.06em; text-transform:uppercase;
    background:none; border:1px solid var(--rule); color:var(--muted);
    border-radius:99px; padding:7px 12px; cursor:pointer;
  }
  .ch.off .mute{background:var(--c); border-color:var(--c); color:var(--surface)}

  .readout{display:flex; align-items:baseline; gap:7px}
  .readout input{
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:600;
    font-size:38px; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
    width:4ch; flex:none; max-width:100%; background:none; border:none; padding:0; color:var(--ink);
    border-bottom:1px dashed transparent;
  }
  .readout input:focus{outline:none; border-bottom-color:var(--c)}
  .readout input::-webkit-outer-spin-button,.readout input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .readout input[type=number]{-moz-appearance:textfield}
  .unit{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--faint)}

  .row{display:flex; align-items:center; gap:10px}
  input[type=range]{
    -webkit-appearance:none; appearance:none; background:none;
    flex:1; min-width:0; height:34px; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--sunken); border:1px solid var(--rule)}
  input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:var(--sunken); border:1px solid var(--rule)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--surface); border:2px solid var(--c); margin-top:-12px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  input[type=range]::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--c);
    background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink); outline-offset:2px}
  .nudge{
    width:40px; height:38px; flex:none; border-radius:8px;
    background:var(--surface); border:1px solid var(--rule); color:var(--ink);
    font:500 17px/1 'IBM Plex Mono',monospace; cursor:pointer;
  }
  .nudge:active{background:var(--sunken)}

  .presets{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent 100%);
    mask-image:linear-gradient(90deg,#000 88%,transparent 100%);
  }
  .presets::-webkit-scrollbar{display:none}
  .presets button{
    flex:none; font:500 12px/1 'IBM Plex Mono',monospace; color:var(--muted);
    background:none; border:1px solid var(--rule); border-radius:99px;
    padding:7px 11px; cursor:pointer; white-space:nowrap;
  }
  .presets button[aria-pressed="true"]{background:var(--c); border-color:var(--c); color:var(--surface)}

  .util{display:flex; gap:8px}
  .util button{
    flex:1; font:500 12px/1 'Archivo',sans-serif; letter-spacing:.04em;
    background:var(--surface); border:1px solid var(--rule); color:var(--muted);
    border-radius:8px; padding:11px 8px; cursor:pointer;
  }
  .util button:active{background:var(--sunken)}

  /* ---- transport ---- */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--rule);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-in{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
  .play{
    width:100%; padding:16px; border-radius:var(--r); border:none; cursor:pointer;
    background:var(--ink); color:var(--ground);
    font:600 15px/1 'Archivo',sans-serif; letter-spacing:.04em; text-transform:uppercase;
  }
  body.playing .play{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--rule)}
  .vol{display:flex; align-items:center; gap:10px}
  .vol label{
    font:500 10px/1 'Archivo',sans-serif; letter-spacing:.1em; text-transform:uppercase;
    color:var(--faint); flex:none; width:44px;
  }
  .vol .pct{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); width:38px; text-align:right; font-variant-numeric:tabular-nums}
  .vol input[type=range]{--c:var(--muted)}
  .save{display:flex; gap:8px; align-items:center}
  .save button{
    flex:1; font:500 12px/1 'Archivo',sans-serif; letter-spacing:.04em;
    background:none; border:1px solid var(--rule); color:var(--muted);
    border-radius:8px; padding:11px; cursor:pointer;
  }
  .save input{
    width:64px; flex:none; text-align:center; padding:11px 6px;
    font:500 12px 'IBM Plex Mono',monospace; color:var(--ink);
    background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  }
  .save span{font-size:11px; color:var(--faint); flex:none}
  .note{font-size:11px; color:var(--faint); line-height:1.5; margin:0}
  footer{font-size:11px; color:var(--faint); line-height:1.6; text-align:center}
</style>
<style>html,body{min-height:100%}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dual Tone Bench</h1>
    <div class="sub">44.1 kHz · sine</div>
  </header>

  <div class="scope">
    <canvas id="scope" aria-label="Waveform of both channels"></canvas>
    <div class="scope-foot">
      <div class="live"><span class="dot"></span><span id="liveTxt">Idle</span></div>
      <div id="delta">Δ 5 Hz</div>
    </div>
  </div>

  <section class="ch L" id="chL">
    <div class="ch-head">
      <div class="ch-name">Left channel</div>
      <button class="mute" data-mute="L" aria-pressed="false">Mute</button>
    </div>
    <div class="readout">
      <input type="number" id="numL" inputmode="decimal" min="1" max="20000" step="1" value="440" aria-label="Left frequency in hertz">
      <span class="unit">Hz</span>
    </div>
    <div class="row">
      <button class="nudge" data-step="-1" data-ch="L" aria-label="Left frequency down">−</button>
      <input type="range" id="rngL" min="0" max="2000" value="0" aria-label="Left frequency slider">
      <button class="nudge" data-step="1" data-ch="L" aria-label="Left frequency up">+</button>
    </div>
    <div class="presets" id="preL"></div>
  </section>

  <section class="ch R" id="chR">
    <div class="ch-head">
      <div class="ch-name">Right channel</div>
      <button class="mute" data-mute="R" aria-pressed="false">Mute</button>
    </div>
    <div class="readout">
      <input type="number" id="numR" inputmode="decimal" min="1" max="20000" step="1" value="445" aria-label="Right frequency in hertz">
      <span class="unit">Hz</span>
    </div>
    <div class="row">
      <button class="nudge" data-step="-1" data-ch="R" aria-label="Right frequency down">−</button>
      <input type="range" id="rngR" min="0" max="2000" value="0" aria-label="Right frequency slider">
      <button class="nudge" data-step="1" data-ch="R" aria-label="Right frequency up">+</button>
    </div>
    <div class="presets" id="preR"></div>
  </section>

  <div class="util">
    <button id="swap">Swap L / R</button>
    <button id="match">Match R to L</button>
  </div>

  <footer>Start quiet, especially on headphones — high tones carry more energy than they seem to.</footer>
</div>

<div class="bar">
  <div class="bar-in">
    <button class="play" id="play">Play</button>
    <div class="vol">
      <label for="rngV">Level</label>
      <input type="range" id="rngV" min="0" max="100" value="35" aria-label="Master level">
      <div class="pct" id="volPct">35%</div>
    </div>
    <div class="save">
      <button id="wav">Save WAV</button>
      <input type="number" id="dur" min="1" max="600" step="1" value="10" aria-label="Length in seconds">
      <span>sec</span>
    </div>
    <p class="note" id="saveNote" hidden></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var FMIN = 1, FMAX = 20000, STEPS = 2000;
  var PRESETS = [20, 60, 100, 440, 1000, 4000, 8000, 12000, 15000, 20000];

  var state = { L: 440, R: 445, vol: 0.35, muteL: false, muteR: false, playing: false };

  var el = {
    numL: document.getElementById('numL'), numR: document.getElementById('numR'),
    rngL: document.getElementById('rngL'), rngR: document.getElementById('rngR'),
    chL: document.getElementById('chL'),  chR: document.getElementById('chR'),
    preL: document.getElementById('preL'), preR: document.getElementById('preR'),
    rngV: document.getElementById('rngV'), volPct: document.getElementById('volPct'),
    play: document.getElementById('play'), wav: document.getElementById('wav'),
    dur: document.getElementById('dur'),  delta: document.getElementById('delta'),
    liveTxt: document.getElementById('liveTxt'), saveNote: document.getElementById('saveNote'),
    canvas: document.getElementById('scope')
  };

  /* ---------- log slider mapping ---------- */
  var RATIO = Math.log(FMAX / FMIN);
  function posToFreq(p){ return FMIN * Math.exp(RATIO * (p / STEPS)); }
  function freqToPos(f){ return Math.round(STEPS * Math.log(f / FMIN) / RATIO); }
  function clamp(f){ return Math.min(FMAX, Math.max(FMIN, f)); }
  function tidy(f){ return f >= 100 ? Math.round(f) : Math.round(f * 10) / 10; }
  function fmt(f){ return f >= 1000 ? (f / 1000).toFixed(f % 1000 === 0 ? 0 : 1) + 'k' : String(tidy(f)); }

  /* ---------- audio graph ---------- */
  var ctx = null, nodes = null;

  function buildGraph(){
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    var merger = ctx.createChannelMerger(2);
    var master = ctx.createGain(); master.gain.value = 0;
    var gL = ctx.createGain(), gR = ctx.createGain();
    var oL = ctx.createOscillator(), oR = ctx.createOscillator();
    oL.type = oR.type = 'sine';
    oL.frequency.value = state.L; oR.frequency.value = state.R;
    gL.gain.value = state.muteL ? 0 : 1;
    gR.gain.value = state.muteR ? 0 : 1;
    oL.connect(gL); gL.connect(merger, 0, 0);
    oR.connect(gR); gR.connect(merger, 0, 1);
    merger.connect(master); master.connect(ctx.destination);
    oL.start(); oR.start();
    nodes = { oL: oL, oR: oR, gL: gL, gR: gR, master: master };
  }

  function ramp(param, value, seconds){
    var t = ctx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(value, t + seconds);
  }

  function pushFreq(){
    if (!ctx) return;
    nodes.oL.frequency.setTargetAtTime(state.L, ctx.currentTime, 0.008);
    nodes.oR.frequency.setTargetAtTime(state.R, ctx.currentTime, 0.008);
  }
  function pushMutes(){
    if (!ctx) return;
    ramp(nodes.gL.gain, state.muteL ? 0 : 1, 0.02);
    ramp(nodes.gR.gain, state.muteR ? 0 : 1, 0.02);
  }
  function pushVol(){
    if (!ctx || !state.playing) return;
    ramp(nodes.master.gain, state.vol * state.vol, 0.03);
  }

  var wakeLock = null;
  function holdScreen(on){
    try {
      if (on && navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; }, function(){});
      } else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }

  function setPlaying(on){
    buildGraph();
    if (ctx.state === 'suspended') ctx.resume();
    state.playing = on;
    ramp(nodes.master.gain, on ? state.vol * state.vol : 0, on ? 0.02 : 0.04);
    document.body.classList.toggle('playing', on);
    el.play.textContent = on ? 'Stop' : 'Play';
    el.liveTxt.textContent = on ? 'Output live' : 'Idle';
    holdScreen(on);
    draw();
  }

  /* ---------- UI sync ---------- */
  function sizeReadout(input){
    input.style.width = Math.max(2, String(input.value).length) + 0.6 + 'ch';
  }

  function render(source){
    if (source !== 'numL') el.numL.value = tidy(state.L);
    if (source !== 'numR') el.numR.value = tidy(state.R);
    sizeReadout(el.numL); sizeReadout(el.numR);
    if (source !== 'rngL') el.rngL.value = freqToPos(state.L);
    if (source !== 'rngR') el.rngR.value = freqToPos(state.R);
    el.chL.classList.toggle('off', state.muteL);
    el.chR.classList.toggle('off', state.muteR);

    var d = Math.abs(state.R - state.L);
    el.delta.textContent = 'Δ ' + (d >= 1000 ? (d / 1000).toFixed(2) + ' kHz' : tidy(d) + ' Hz')
                         + (d > 0 && d <= 20 ? ' · beating' : '');

    syncPresets(el.preL, state.L);
    syncPresets(el.preR, state.R);
    pushFreq(); pushMutes();
    draw();
  }

  function setFreq(ch, f, source){
    f = clamp(f);
    if (ch === 'L') state.L = f; else state.R = f;
    render(source);
  }

  function buildPresets(host, ch){
    PRESETS.forEach(function(p){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = fmt(p);
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function(){ setFreq(ch, p); });
      host.appendChild(b);
    });
  }
  function syncPresets(host, f){
    var kids = host.children;
    for (var i = 0; i < kids.length; i++)
      kids[i].setAttribute('aria-pressed', Math.abs(PRESETS[i] - f) < 0.05 ? 'true' : 'false');
  }

  buildPresets(el.preL, 'L');
  buildPresets(el.preR, 'R');

  el.rngL.addEventListener('input', function(){ setFreq('L', tidy(posToFreq(+this.value)), 'rngL'); });
  el.rngR.addEventListener('input', function(){ setFreq('R', tidy(posToFreq(+this.value)), 'rngR'); });
  el.numL.addEventListener('input', function(){ if (this.value !== '') setFreq('L', parseFloat(this.value) || FMIN, 'numL'); });
  el.numR.addEventListener('input', function(){ if (this.value !== '') setFreq('R', parseFloat(this.value) || FMIN, 'numR'); });
  el.numL.addEventListener('blur', function(){ render(); });
  el.numR.addEventListener('blur', function(){ render(); });

  Array.prototype.forEach.call(document.querySelectorAll('.nudge'), function(b){
    var timer = null, delay = null;
    function bump(){
      var ch = b.dataset.ch, cur = ch === 'L' ? state.L : state.R;
      setFreq(ch, tidy(cur + (+b.dataset.step) * (cur >= 1000 ? 10 : 1)));
    }
    function start(e){ e.preventDefault(); bump(); delay = setTimeout(function(){ timer = setInterval(bump, 60); }, 420); }
    function stop(){ clearTimeout(delay); clearInterval(timer); }
    b.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev, stop); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.mute'), function(b){
    b.addEventListener('click', function(){
      var k = 'mute' + b.dataset.mute;
      state[k] = !state[k];
      b.setAttribute('aria-pressed', String(state[k]));
      b.textContent = state[k] ? 'Muted' : 'Mute';
      render();
    });
  });

  document.getElementById('swap').addEventListener('click', function(){
    var t = state.L; state.L = state.R; state.R = t; render();
  });
  document.getElementById('match').addEventListener('click', function(){
    state.R = state.L; render();
  });

  el.rngV.addEventListener('input', function(){
    state.vol = +this.value / 100;
    el.volPct.textContent = this.value + '%';
    pushVol(); draw();
  });

  el.play.addEventListener('click', function(){ setPlaying(!state.playing); });

  /* ---------- scope ---------- */
  var cv = el.canvas, g = cv.getContext('2d'), W = 0, H = 0, driftT0 = performance.now(), raf = null;

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function trace(freq, span, phase, color, amp, on){
    g.beginPath();
    for (var x = 0; x <= W; x++) {
      var t = (x / W) * span;
      var y = H / 2 - Math.sin(2 * Math.PI * freq * t + phase) * (H / 2 - 8) * amp;
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.strokeStyle = color;
    g.globalAlpha = on ? 1 : 0.32;
    g.lineWidth = 2; g.lineJoin = 'round'; g.lineCap = 'round';
    g.stroke();
    g.globalAlpha = 1;
  }

  function draw(){
    if (!W) return;
    g.clearRect(0, 0, W, H);

    /* baseline grid */
    g.strokeStyle = css('--rule'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, H / 2 + .5); g.lineTo(W, H / 2 + .5); g.stroke();

    var span = 3 / Math.max(state.L, state.R);          /* seconds across the width */
    var amp  = 0.25 + 0.75 * state.vol;
    var d    = Math.abs(state.R - state.L);
    var drift = (state.playing && d > 0 && d <= 20)
      ? 2 * Math.PI * (state.R - state.L) * ((performance.now() - driftT0) / 1000) : 0;

    trace(state.L, span, 0, css('--left'), amp, state.playing && !state.muteL);
    trace(state.R, span, drift, css('--right'), amp, state.playing && !state.muteR);

    if (raf) cancelAnimationFrame(raf);
    if (state.playing && d > 0 && d <= 20) raf = requestAnimationFrame(draw);
  }

  /* ---------- WAV export ---------- */
  function buildWav(seconds){
    var sr = 44100, total = Math.max(1, Math.round(seconds * sr)), fade = Math.min(Math.round(0.005 * sr), total >> 1);
    var buf = new ArrayBuffer(44 + total * 4), v = new DataView(buf), i;
    function str(off, s){ for (i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + total * 4, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true);
    v.setUint16(32, 4, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, total * 4, true);

    var a = state.vol * state.vol * 32000, off = 44;
    var sL = 2 * Math.PI * state.L / sr, sR = 2 * Math.PI * state.R / sr, pL = 0, pR = 0;
    for (i = 0; i < total; i++) {
      var env = 1;
      if (i < fade) env = i / fade;
      else if (i >= total - fade) env = (total - 1 - i) / fade;
      v.setInt16(off, state.muteL ? 0 : Math.round(Math.sin(pL) * env * a), true); off += 2;
      v.setInt16(off, state.muteR ? 0 : Math.round(Math.sin(pR) * env * a), true); off += 2;
      pL += sL; pR += sR;
      if (pL > 2 * Math.PI) pL -= 2 * Math.PI;
      if (pR > 2 * Math.PI) pR -= 2 * Math.PI;
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  el.wav.addEventListener('click', function(){
    var secs = Math.min(600, Math.max(1, parseFloat(el.dur.value) || 10));
    el.wav.textContent = 'Building…';
    setTimeout(function(){
      var url = URL.createObjectURL(buildWav(secs));
      var a = document.createElement('a');
      a.href = url;
      a.download = tidy(state.L) + 'Hz-' + tidy(state.R) + 'Hz-' + secs + 's.wav';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      el.wav.textContent = 'Save WAV';
    }, 20);
  });

  if (window.self !== window.top) {
    el.wav.disabled = true;
    el.wav.style.opacity = '.45';
    el.wav.style.cursor = 'not-allowed';
    el.dur.disabled = true;
    el.saveNote.hidden = false;
    el.saveNote.textContent = 'WAV export is turned off here — this view cannot hand files to your device. Open the standalone copy of this page to save one.';
  }

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && state.playing && ctx && ctx.state === 'suspended') ctx.resume();
  });

  el.rngL.value = freqToPos(state.L);
  el.rngR.value = freqToPos(state.R);
  resize();
  render();
})();
</script>
<style>
  #install{
    font:500 11px/1 'Archivo',sans-serif; letter-spacing:.06em; text-transform:uppercase;
    background:var(--ink); color:var(--ground); border:none; border-radius:99px;
    padding:8px 14px; cursor:pointer; flex:none;
  }
  #install:active{opacity:.8}
</style>
<script>
(function(){
  "use strict";
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  var standalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
  if (standalone) return;

  var prompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    prompt = e;
    var btn = document.createElement('button');
    btn.id = 'install';
    btn.type = 'button';
    btn.textContent = 'Install';
    btn.addEventListener('click', function(){
      if (!prompt) return;
      btn.disabled = true;
      prompt.prompt();
      prompt.userChoice.then(function(c){
        if (c.outcome === 'accepted') btn.remove();
        else { btn.disabled = false; prompt = null; btn.remove(); }
      });
    });
    var header = document.querySelector('header');
    if (header) header.appendChild(btn);
  });

  window.addEventListener('appinstalled', function(){
    var b = document.getElementById('install');
    if (b) b.remove();
  });
})();
</script>

</body>
</html>
